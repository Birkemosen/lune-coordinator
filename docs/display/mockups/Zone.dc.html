<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1024, "height": 600}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { t: 22.0, preset: 'c' }; }
  renderVals() {
    const s = this.state;
    const set = (v, p) => this.setState({ t: Math.min(28, Math.max(12, v)), preset: p });
    const list = [{ id: 'c', label: 'Komfort', v: 22 }, { id: 'e', label: 'Eco', v: 20 }, { id: 'n', label: 'Nat', v: 18 }];
    return {
      target: s.t.toFixed(1).replace('.', ','),
      dec: () => set(s.t - 0.5, null),
      inc: () => set(s.t + 0.5, null),
      presets: list.map((p) => ({
        txt: p.label + ' ' + p.v + '°',
        bg: s.preset === p.id ? '#f7f3ef' : '#292821',
        fg: s.preset === p.id ? '#101010' : '#f7f3ef',
        pick: () => set(p.v, p.id)
      }))
    };
  }
}
</script>
