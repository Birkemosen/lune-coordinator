lvgl:
  color_depth: 16
  bg_color: ${lds_bg}
  default_font: lds_font_sm
  style_definitions:
    - id: lds_card           # panel: huset, manifold-række, zone-kort
      bg_color: ${lds_card}
      bg_opa: COVER
      radius: 20
      border_width: 0
      shadow_width: 0
      pad_all: 16
    - id: lds_tile           # zonefelt (på kort)
      bg_color: ${lds_raised}
      bg_opa: COVER
      radius: 14
      border_width: 0
      pad_all: 10
      text_color: ${lds_fg}
    - id: lds_tile_primary   # gruppens primære zone
      border_width: 2
      border_color: ${lds_violet}
    - id: lds_tile_selected  # valgt/presset: inverteret
      bg_color: ${lds_inv_bg}
      text_color: ${lds_inv_fg}
    - id: lds_seg_on       # ventilåbning: neutral
      bg_color: ${lds_fg}
      bg_opa: COVER
      radius: 2
    - id: lds_seg_off
      bg_color: ${lds_seg_off}
      bg_opa: COVER
      radius: 2
    - id: lds_seg_fault
      bg_color: ${lds_danger}
      bg_opa: COVER
      radius: 2
    - id: lds_btn_round      # ‹ › − +  (64 / 96 px)
      bg_color: ${lds_raised}
      bg_opa: COVER
      radius: 999
      border_width: 0
      shadow_width: 0
      text_color: ${lds_fg}
    - id: lds_btn_pill       # forvalg og handlinger (64 px høj)
      bg_color: ${lds_raised}
      bg_opa: COVER
      radius: 999
      border_width: 0
      shadow_width: 0
      pad_hor: 28
      text_color: ${lds_fg}
      text_font: lds_font_sm
    - id: lds_btn_active     # aktivt forvalg / primær
      bg_color: ${lds_inv_bg}
      text_color: ${lds_inv_fg}
    - id: lds_btn_danger     # Nulstil fejl
      bg_color: ${lds_danger}
      text_color: ${lds_bg}
    - id: lds_badge_hot
      bg_color: ${lds_accent_ink}
      bg_opa: COVER
      radius: 999
      pad_hor: 14
      pad_ver: 4
      text_color: ${lds_on_accent}
      text_font: lds_font_xs
    - id: lds_badge_bad
      bg_color: ${lds_danger_bg}
      bg_opa: COVER
      radius: 999
      pad_hor: 14
      pad_ver: 4
      text_color: ${lds_danger}
      text_font: lds_font_xs
    - id: lds_msg_info
      bg_color: ${lds_info_bg}
      bg_opa: COVER
      radius: 12
      pad_all: 12
      text_color: ${lds_info}
      text_font: lds_font_xs
    - id: lds_text_muted
      text_color: ${lds_muted}
    - id: lds_text_hero
      text_font: lds_font_hero
      text_color: ${lds_fg}
