<!-- LDS: fælles SVG-gradienter og mønstre til grafer (refereres fra CSS med url(#…)). Indsæt én gang pr. side, INDE i .app, så var(--accent) osv. er defineret og følger temaet. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="lds-fade-heat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color: var(--accent); stop-opacity: .5"/><stop offset="1" style="stop-color: var(--accent); stop-opacity: 0"/></linearGradient>
    <linearGradient id="lds-fade-info" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color: var(--data-return); stop-opacity: .45"/><stop offset="1" style="stop-color: var(--data-return); stop-opacity: 0"/></linearGradient>
    <linearGradient id="lds-fade-light" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color: var(--data-light); stop-opacity: .45"/><stop offset="1" style="stop-color: var(--data-light); stop-opacity: 0"/></linearGradient>
    <linearGradient id="lds-fade-danger" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color: var(--danger); stop-opacity: .45"/><stop offset="1" style="stop-color: var(--danger); stop-opacity: 0"/></linearGradient>
    <pattern id="lds-hatch-heat" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" style="fill: var(--accent); fill-opacity: .06"/><line x1="0" y1="0" x2="0" y2="7" style="stroke: var(--accent); stroke-opacity: .55; stroke-width: 1.5"/></pattern>
    <!-- Tættere kryds-skravering: anden serie i varme-domænet (fx legionella ved siden af varmt vand). -->
    <pattern id="lds-hatch-heat-dense" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="4" height="4" style="fill: var(--accent); fill-opacity: .06"/><line x1="0" y1="0" x2="0" y2="4" style="stroke: var(--accent); stroke-opacity: .6; stroke-width: 1"/><line x1="0" y1="0" x2="4" y2="0" style="stroke: var(--accent); stroke-opacity: .6; stroke-width: 1"/></pattern>
  </defs>
</svg>
