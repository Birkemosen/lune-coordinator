# Generated by esphome@aurora-smart-home v1.1.0
# https://github.com/tonylofgren/aurora-smart-home
#
# Shared Lune Touch / Mini coordinator base. Product entrypoints add display
# hardware when present.

substitutions:
  device_name: lune-touch
  friendly_name: "Lune Touch"
  fallback_ap_ssid: "Lune Touch Setup"
  project_name: birkemosen.lune-touch
  device_comment: "Lune coordinator"

esphome:
  name: ${device_name}
  name_add_mac_suffix: true
  friendly_name: ${friendly_name}
  comment: ${device_comment}
  project:
    name: ${project_name}
    version: ${firmware_version}${firmware_suffix}
  on_boot:
    - priority: 800
      then:
        - logger.log: "${friendly_name} booting: config/NVS and coordinator model first"
    - priority: 600
      then:
        - logger.log: "${friendly_name} UI/display bringup point"
    - priority: 250
      then:
        - logger.log: "${friendly_name} WiFi and coordinator polling may start after UI shell"

packages:
  version: !include version.yaml
  board: !include packages/board/esp32-s3-16mb-psram.yaml
  wifi: !include packages/network/wifi.yaml
  api: !include packages/network/api.yaml
  ota: !include packages/network/ota.yaml
  diagnostics: !include packages/system/diagnostics.yaml
  dashboard: !include packages/dashboard/dashboard.yaml

external_components:
  - source:
      type: local
      path: ../components
    components:
      - ch422g
      - lune_touch_dashboard
      - lune_touch_coordinator
      - lune_wifi
      - rpi_dpi_rgb

logger:
  level: DEBUG
  logs:
    component: WARN
    sensor: WARN
    text_sensor: WARN

preferences:
  flash_write_interval: 15min

improv_serial:

mdns:
  disabled: true

time:
  - platform: sntp
    id: sntp_time

lune_touch_coordinator:
  id: lune_touch_app
  node_stale_after: 300s
  time_id: sntp_time
