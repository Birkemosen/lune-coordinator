# Credentials from secrets.yaml for development builds of the owner's devices:
# the WiFi seed, the API encryption key and the OTA password. Release images
# (configurations/*-release.yaml) leave this package out, so a published
# firmware file carries none of the build host's secrets.

lune_wifi:
  seed_ssid: !secret wifi_ssid
  seed_password: !secret wifi_password

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password
