# OTA for Lune Touch
# - platform esphome: CLI / HA native OTA (password from secrets.yaml in
#   development builds, packages/network/build-secrets.yaml; none in release images)
# - platform web_server: browser POST /update on web_server_base (Service › Firmware)

ota:
  - platform: esphome
  - platform: web_server

safe_mode:
  boot_is_good_after: 60s
