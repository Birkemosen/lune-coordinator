# Generated by esphome@aurora-smart-home v1.1.0
# https://github.com/tonylofgren/aurora-smart-home

debug:
  update_interval: 30s

sensor:
  - platform: wifi_signal
    id: wifi_signal_dbm
    name: "${friendly_name} WiFi Signal"
    update_interval: 60s
  - platform: uptime
    id: lune_touch_uptime
    name: "${friendly_name} Uptime"
    update_interval: 60s
  - platform: debug
    free:
      name: "${friendly_name} Heap Free"
    block:
      name: "${friendly_name} Heap Max Block"
    loop_time:
      name: "${friendly_name} Loop Time"

text_sensor:
  - platform: template
    id: firmware_version_text
    name: "${friendly_name} Firmware Version"
    entity_category: diagnostic
    update_interval: 6h
    lambda: |-
      return {"${firmware_version}${firmware_suffix}"};
  - platform: wifi_info
    ip_address:
      id: ip_address_text
      name: "${friendly_name} IP Address"
    ssid:
      id: connected_ssid_text
      name: "${friendly_name} Connected SSID"
    mac_address:
      id: mac_address_text
      name: "${friendly_name} MAC Address"
