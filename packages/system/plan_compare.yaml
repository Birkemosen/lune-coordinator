# Touch's and Odin's plans side by side, so Home Assistant keeps them in its long-term
# statistics (hourly mean/min/max, kept for good) next to the heat pump's delivered heat
# and electricity. "now" is this hour's output in kW as planned at the day's first solve
# (just after local midnight): its hourly mean is the planned kWh for the hour, so a day's
# sum is the day plan. "today" is that day plan's total. "24 h" is the rolling plan from
# this hour on, space heat only, as the planner page's Touch vs Odin table. Unknown while a
# plan is missing.

sensor:
  - platform: template
    id: lune_plan_touch_heat_kw
    name: "Plan Touch heat now"
    icon: mdi:heat-wave
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 60s
    lambda: |-
      lune_touch_coordinator::LuneTouchCoordinator::PlanCompare c;
      if (!id(lune_touch_app).plan_compare(&c) || !std::isfinite(c.touch_heat_kw))
        return {};
      return c.touch_heat_kw;
  - platform: template
    id: lune_plan_odin_heat_kw
    name: "Plan Odin heat now"
