# Generated by esphome@aurora-smart-home v1.1.0
# https://github.com/tonylofgren/aurora-smart-home
#
# ESP32-S3 16 MB flash / PSRAM profile for the first 7-inch Lune Touch
# prototype. The custom partition table is intentionally selected from day one
# so OTA slot sizing is proven before the UI becomes large.

esphome:
  min_version: 2026.8.0
  platformio_options:
    board_build.flash_mode: qio
    board_build.psram_type: opi
    board_build.partitions: ../../../../partitions/lune_touch_16mb_ota.csv
    board_build.extra_flags:
      - -DBOARD_HAS_PSRAM
      - -DLUNE_TOUCH_TARGET_7IN_RGB

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  # ESPHome 2026.8 defaults to its native ESP-IDF builder. Keep the supported
  # PlatformIO path while the repository's build/deploy tooling is migrated;
  # ESPHome then selects the matching pioarduino platform and compiler for the
  # recommended ESP-IDF release instead of combining independently pinned
  # packages.
  toolchain: platformio
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESPTOOLPY_FLASHSIZE_16MB: "y"
      CONFIG_PARTITION_TABLE_CUSTOM: "y"
      CONFIG_PARTITION_TABLE_CUSTOM_FILENAME: "lune_touch_16mb_ota.csv"
      CONFIG_PARTITION_TABLE_FILENAME: "lune_touch_16mb_ota.csv"
      CONFIG_PARTITION_TABLE_OFFSET: "0x8000"
      CONFIG_LCD_RGB_ISR_IRAM_SAFE: "y"
      CONFIG_LCD_RGB_RESTART_IN_VSYNC: "y"
      # RGB bounce-buffer refills copy cache lines from PSRAM in an ISR. A
      # 64-byte data-cache line materially reduces refill overhead and screen
      # drift when WiFi/flash traffic is active.
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM: "y"
      CONFIG_SPIRAM_MODE_OCT: "y"
      CONFIG_SPIRAM_SPEED_80M: "y"
      CONFIG_SPIRAM_XIP_FROM_PSRAM: "y"
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: "y"
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "0"
      CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL: "32768"
      CONFIG_FREERTOS_CHECK_STACKOVERFLOW_CANARY: "y"
      CONFIG_FREERTOS_TASK_CREATE_ALLOW_EXT_MEM: "y"
      CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM: "3"
      CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM: "16"
      CONFIG_ESP_WIFI_STATIC_TX_BUFFER_NUM: "8"
      CONFIG_ESP_WIFI_RX_BA_WIN: "4"
      CONFIG_ESP_WIFI_TX_BA_WIN: "6"
      CONFIG_ESP_WIFI_TASK_PINNED_TO_CORE_0: "y"
      CONFIG_LWIP_MAX_SOCKETS: "16"
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "15"
      CONFIG_ESP_MAIN_TASK_STACK_SIZE: "16384"
      CONFIG_MBEDTLS_DEFAULT_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_INTERNAL_MEM_ALLOC: "n"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "n"
      CONFIG_ESP_COREDUMP_ENABLE_TO_FLASH: "y"
      CONFIG_ESP_COREDUMP_DATA_FORMAT_ELF: "y"
    advanced:
      # The RGB bounce-buffer ISR is deadline-sensitive. Prefer throughput over
      # minimum firmware size; the 16 MB partition layout has ample headroom.
      compiler_optimization: PERF

psram:
  mode: octal
  speed: 80MHz
