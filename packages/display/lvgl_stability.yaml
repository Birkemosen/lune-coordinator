                id(page_home_zone_1_4_seg3), id(page_home_zone_1_4_seg4)},
               {id(page_home_zone_1_5_seg0), id(page_home_zone_1_5_seg1), id(page_home_zone_1_5_seg2),
                id(page_home_zone_1_5_seg3), id(page_home_zone_1_5_seg4)}},
              {{id(page_home_zone_2_0_seg0), id(page_home_zone_2_0_seg1), id(page_home_zone_2_0_seg2),
                id(page_home_zone_2_0_seg3), id(page_home_zone_2_0_seg4)},
               {id(page_home_zone_2_1_seg0), id(page_home_zone_2_1_seg1), id(page_home_zone_2_1_seg2),
                id(page_home_zone_2_1_seg3), id(page_home_zone_2_1_seg4)},
               {id(page_home_zone_2_2_seg0), id(page_home_zone_2_2_seg1), id(page_home_zone_2_2_seg2),
                id(page_home_zone_2_2_seg3), id(page_home_zone_2_2_seg4)},
               {id(page_home_zone_2_3_seg0), id(page_home_zone_2_3_seg1), id(page_home_zone_2_3_seg2),
                id(page_home_zone_2_3_seg3), id(page_home_zone_2_3_seg4)},
               {id(page_home_zone_2_4_seg0), id(page_home_zone_2_4_seg1), id(page_home_zone_2_4_seg2),
                id(page_home_zone_2_4_seg3), id(page_home_zone_2_4_seg4)},
               {id(page_home_zone_2_5_seg0), id(page_home_zone_2_5_seg1), id(page_home_zone_2_5_seg2),
                id(page_home_zone_2_5_seg3), id(page_home_zone_2_5_seg4)}},
              {{id(page_home_zone_3_0_seg0), id(page_home_zone_3_0_seg1), id(page_home_zone_3_0_seg2),
                id(page_home_zone_3_0_seg3), id(page_home_zone_3_0_seg4)},
               {id(page_home_zone_3_1_seg0), id(page_home_zone_3_1_seg1), id(page_home_zone_3_1_seg2),
                id(page_home_zone_3_1_seg3), id(page_home_zone_3_1_seg4)},
               {id(page_home_zone_3_2_seg0), id(page_home_zone_3_2_seg1), id(page_home_zone_3_2_seg2),
                id(page_home_zone_3_2_seg3), id(page_home_zone_3_2_seg4)},
               {id(page_home_zone_3_3_seg0), id(page_home_zone_3_3_seg1), id(page_home_zone_3_3_seg2),
                id(page_home_zone_3_3_seg3), id(page_home_zone_3_3_seg4)},
               {id(page_home_zone_3_4_seg0), id(page_home_zone_3_4_seg1), id(page_home_zone_3_4_seg2),
                id(page_home_zone_3_4_seg3), id(page_home_zone_3_4_seg4)},
               {id(page_home_zone_3_5_seg0), id(page_home_zone_3_5_seg1), id(page_home_zone_3_5_seg2),
                id(page_home_zone_3_5_seg3), id(page_home_zone_3_5_seg4)}}
            };
            const uint8_t active_page = id(lune_touch_app).display_active_page();
            if (active_page != previous_active_page) {
              previous_active_page = active_page;
              for (uint8_t i = 0; i < 3; i++) {
                if (page_ids[i] == active_page)
                  lv_obj_clear_flag(pages[i], LV_OBJ_FLAG_HIDDEN);
                else
                  lv_obj_add_flag(pages[i], LV_OBJ_FLAG_HIDDEN);
              }
              id(menu_open) = (active_page == 3);
              if (active_page != 2) {
                id(zone_detail_keypad_open) = false;
                id(controller_picker_open) = false;
              }
            }

            const auto fmt_c = [](float v, bool with_unit) -> std::string {
              if (!std::isfinite(v))
                return with_unit ? std::string("--,- °C") : std::string("--,-°");
              char buf[24];
              if (with_unit)
                std::snprintf(buf, sizeof(buf), "%.1f °C", v);
              else
                std::snprintf(buf, sizeof(buf), "%.1f°", v);
              for (char *p = buf; *p; ++p)
                if (*p == '.')
                  *p = ',';
              return buf;
            };
            const auto strip_c = [](std::string value) {
              if (value.size() >= 2 && value.compare(value.size() - 2, 2, " C") == 0)
                value.resize(value.size() - 2);
              for (char &ch : value)
                if (ch == '.')
                  ch = ',';
              return value;
            };

            // Palette: dark default, light when overview_day_theme (Home2_Day).
            const bool light = id(overview_day_theme);
            const uint32_t c_bg = light ? ${lds_light_bg} : ${lds_bg};
            const uint32_t c_card = light ? ${lds_light_card} : ${lds_card};
            const uint32_t c_raised = light ? ${lds_light_raised} : ${lds_raised};
            const uint32_t c_fg = light ? ${lds_light_fg} : ${lds_fg};
            const uint32_t c_muted = light ? ${lds_light_muted} : ${lds_muted};
            const uint32_t c_faint = light ? ${lds_light_faint} : ${lds_faint};
            const uint32_t c_accent = light ? ${lds_light_accent} : ${lds_accent};
            const uint32_t c_accent_ink = light ? ${lds_light_accent_ink} : ${lds_accent_ink};
            const uint32_t c_info = light ? ${lds_light_info} : ${lds_info};
            const uint32_t c_info_bg = light ? ${lds_light_info_bg} : ${lds_info_bg};
            const uint32_t c_warn = light ? ${lds_light_warn} : ${lds_warn};
            const uint32_t c_danger = light ? ${lds_light_danger} : ${lds_danger};
            const uint32_t c_danger_bg = light ? ${lds_light_danger_bg} : ${lds_danger_bg};
            const uint32_t c_seg_off = light ? ${lds_light_seg_off} : ${lds_seg_off};
            const uint32_t c_line = light ? ${lds_light_line} : ${lds_line};
            const uint32_t c_field = light ? ${lds_light_field} : ${lds_field};
            // LDS 2.3.8: afvigelse fra mål i 5 trin (blå ← neutral → orange), som web-varmekortet.
            const uint32_t c_dev[5] = {
              light ? ${lds_light_dev_1} : ${lds_dev_1}, light ? ${lds_light_dev_2} : ${lds_dev_2},
              light ? ${lds_light_dev_3} : ${lds_dev_3}, light ? ${lds_light_dev_4} : ${lds_dev_4},
              light ? ${lds_light_dev_5} : ${lds_dev_5}};
            const uint32_t c_on_dev1 = light ? ${lds_light_on_dev_1} : ${lds_on_dev_1};
            const uint32_t c_on_warn_fill = light ? ${lds_light_on_warn_fill} : ${lds_on_warn_fill};

            set_label(id(dashboard_system_status_label), id(lune_touch_app).display_header_text());
            set_label(id(page_home_meta_label), id(lune_touch_app).display_zone_detail_meta_text());
            set_label(id(page_zone_detail_meta_label), id(lune_touch_app).display_zone_detail_meta_text());

            const uint8_t wifi_bars = id(lune_touch_app).display_wifi_bars();
            const uint32_t wifi_on = c_fg;
            const uint32_t wifi_off = c_faint;
            lv_obj_t *wifi_icons[5] = {
              id(page_home_wifi_0), id(page_home_wifi_1), id(page_home_wifi_2),
              id(page_home_wifi_3), id(page_home_wifi_4)
            };
            for (uint8_t bar = 0; bar < 5; bar++) {
              const uint32_t color = bar < wifi_bars ? wifi_on : wifi_off;
              lv_obj_set_style_arc_color(wifi_icons[bar], lv_color_hex(color), LV_PART_MAIN);
              lv_obj_set_style_arc_color(wifi_icons[bar], lv_color_hex(color), LV_PART_INDICATOR);
            }

            // Overview Home2/Home4
            if (active_page == 0) {
              lv_obj_set_style_bg_color(id(page_home), lv_color_hex(c_bg), LV_PART_MAIN);
              lv_obj_set_style_bg_color(id(page_home_house), lv_color_hex(c_card), LV_PART_MAIN);
              lv_obj_set_style_bg_color(id(page_home_house_chart), lv_color_hex(c_field), LV_PART_MAIN);
              lv_obj_set_style_bg_color(id(page_home_house_sep), lv_color_hex(c_line), LV_PART_MAIN);
              lv_obj_set_style_bg_color(id(page_home_house_msg), lv_color_hex(c_info_bg), LV_PART_MAIN);
              lv_obj_set_style_text_color(id(page_home_house_label), lv_color_hex(c_muted), LV_PART_MAIN);
              lv_obj_set_style_text_color(id(page_home_house_calling), lv_color_hex(c_accent_ink), LV_PART_MAIN);
              lv_obj_set_style_text_color(id(page_home_house_temp), lv_color_hex(c_fg), LV_PART_MAIN);
              lv_obj_set_style_text_color(id(page_home_house_target), lv_color_hex(c_muted), LV_PART_MAIN);
              lv_obj_set_style_text_color(id(page_home_house_chart_hint), lv_color_hex(c_faint), LV_PART_MAIN);
              lv_obj_set_style_text_color(id(page_home_house_hs_label), lv_color_hex(c_muted), LV_PART_MAIN);
              lv_obj_set_style_text_color(id(page_home_house_hs_temps), lv_color_hex(c_fg), LV_PART_MAIN);
              lv_obj_set_style_text_color(id(page_home_house_hs_pump), lv_color_hex(c_muted), LV_PART_MAIN);
              lv_obj_set_style_text_color(id(page_home_house_msg_text), lv_color_hex(c_info), LV_PART_MAIN);
              lv_obj_set_style_text_color(id(page_home_clock), lv_color_hex(c_fg), LV_PART_MAIN);
              lv_obj_set_style_text_color(id(page_home_date), lv_color_hex(c_muted), LV_PART_MAIN);
              lv_obj_set_style_text_color(id(page_home_wx_temp), lv_color_hex(c_fg), LV_PART_MAIN);
              lv_obj_set_style_text_color(id(page_home_wx_wind), lv_color_hex(c_info), LV_PART_MAIN);

              // Clock + date from SNTP
              auto now = id(sntp_time).now();
              if (now.is_valid()) {
                char clock_buf[8];
                std::snprintf(clock_buf, sizeof(clock_buf), "%02d:%02d", now.hour, now.minute);
                set_label(id(page_home_clock), clock_buf);
                static const char *k_days[] = {
                  "søn", "man", "tir", "ons", "tor", "fre", "lør"
                };
                static const char *k_months[] = {
                  "", "januar", "februar", "marts", "april", "maj", "juni",
                  "juli", "august", "september", "oktober", "november", "december"
                };
                char date_buf[48];
                // ESPHome day_of_week: 1=Sunday .. 7=Saturday
                const char *day = k_days[(now.day_of_week >= 1 && now.day_of_week <= 7)
                                            ? (now.day_of_week - 1) : 0];
                const char *mon = (now.month >= 1 && now.month <= 12) ? k_months[now.month] : "";
                std::snprintf(date_buf, sizeof(date_buf), "%s %d. %s", day, now.day_of_month, mon);
                set_label(id(page_home_date), date_buf);
              }

              // Weather from forecast hour 0 (+ PNG sky icon)
              std::string wx_temp = id(lune_touch_app).display_forecast_hour_temp(0);
              if (!wx_temp.empty() && wx_temp != "--") {
                set_label(id(page_home_wx_temp), strip_c(wx_temp) + " °C");
              } else {
                set_label(id(page_home_wx_temp), "--,- °C");
              }
              std::string wx_wind = id(lune_touch_app).display_forecast_hour_wind(0);
              if (!wx_wind.empty() && wx_wind != "--") {
                set_label(id(page_home_wx_wind), wx_wind.find("m/s") == std::string::npos
                                                    ? (strip_c(wx_wind) + " m/s")
                                                    : wx_wind);
              } else {
                set_label(id(page_home_wx_wind), "");
              }
              {
                const uint8_t sky = id(lune_touch_app).display_forecast_hour_sky(0);
                lv_obj_t *icons[7] = {
                  id(page_home_wx_sky_0), id(page_home_wx_sky_1), id(page_home_wx_sky_2),
                  id(page_home_wx_sky_3), id(page_home_wx_sky_4), id(page_home_wx_sky_5),
                  id(page_home_wx_sky_6)
                };
                const uint8_t idx = sky < 7 ? sky : 2;
                for (uint8_t i = 0; i < 7; i++) {
                  if (i == idx)
                    lv_obj_clear_flag(icons[i], LV_OBJ_FLAG_HIDDEN);
                  else
                    lv_obj_add_flag(icons[i], LV_OBJ_FLAG_HIDDEN);
                }
              }

              // Fault pill
              const bool has_problem = id(lune_touch_app).display_problem_visible();
              const std::string problem = id(lune_touch_app).display_problem_text();
              if (has_problem && !problem.empty()) {
                lv_obj_clear_flag(id(page_home_fault_pill), LV_OBJ_FLAG_HIDDEN);
                lv_obj_set_style_bg_color(id(page_home_fault_pill), lv_color_hex(c_danger_bg), LV_PART_MAIN);
                lv_obj_set_style_text_color(id(page_home_fault_text), lv_color_hex(c_danger), LV_PART_MAIN);
                set_label(id(page_home_fault_text), problem);
              } else {
                lv_obj_add_flag(id(page_home_fault_pill), LV_OBJ_FLAG_HIDDEN);
              }

              // House row
              const float house_t = id(lune_touch_app).display_house_temperature_c();
              const float house_sp = id(lune_touch_app).display_house_target_c();
              set_label(id(page_home_house_temp), fmt_c(house_t, false));
              const uint8_t calling = id(lune_touch_app).display_calling_zone_count();
              const uint8_t zones_n = id(lune_touch_app).display_enabled_zone_count();
              if (calling > 0) {
                set_label(id(page_home_house_calling), "● Kalder");
                char tgt[48];
                std::snprintf(tgt, sizeof(tgt), "%u af %u kalder",
                              static_cast<unsigned>(calling),
                              static_cast<unsigned>(std::max<uint8_t>(zones_n, calling)));
                set_label(id(page_home_house_target), tgt);
              } else {
                set_label(id(page_home_house_calling), "");
                set_label(id(page_home_house_target),
                          std::isfinite(house_sp) ? ("mål " + fmt_c(house_sp, false)) : "");
              }
              // TODO(trin2): 48-point house chart — no history ring buffer yet.
              set_label(id(page_home_house_chart_hint), "−24 t                        nu");

              // Heat source / pump from primary manifold + circulation
              const uint8_t node_count = id(lune_touch_app).display_visible_node_count();
              // Heat-pump flow → return from Asgard; the manifold rows below
              // already show each V6's own flow/return.
              const std::string hp_temps = id(lune_touch_app).display_heat_pump_temps_text();
              if (!hp_temps.empty()) {
                set_label(id(page_home_house_hs_temps), hp_temps);
              } else if (node_count > 0) {
                const std::string flow = strip_c(id(lune_touch_app).display_controller_flow_text(0));
                const std::string ret = strip_c(id(lune_touch_app).display_controller_return_text(0));
                set_label(id(page_home_house_hs_temps), flow + "° → " + ret + "°");
              } else {
                set_label(id(page_home_house_hs_temps), "--,-° → --,-°");
              }
              if (id(lune_touch_app).display_circulation_visible()) {
                std::string pump = id(lune_touch_app).display_circulation_flow_text();
                std::string power = id(lune_touch_app).display_circulation_power_text();
                set_label(id(page_home_house_hs_pump),
                          std::string("Pumpe ") + pump + " l/min · " + power + " W");
              } else {
                set_label(id(page_home_house_hs_pump), "");
              }
              // Asgard / Odin status: 0 = not set up (faint), 1 ok, 2 warn, 3 fault.
              {
                const uint32_t c_ok = light ? ${lds_light_ok} : ${lds_ok};
                auto status_color = [&](uint8_t st) -> uint32_t {
                  return st == 1 ? c_ok : (st == 2 ? c_warn : (st == 3 ? c_danger : c_faint));
                };
                const uint8_t asgard_st = id(lune_touch_app).display_asgard_status();
                const uint8_t odin_st = id(lune_touch_app).display_odin_status();
                lv_obj_set_style_bg_color(id(page_home_hs_asgard_dot), lv_color_hex(status_color(asgard_st)), LV_PART_MAIN);
                lv_obj_set_style_bg_color(id(page_home_hs_odin_dot), lv_color_hex(status_color(odin_st)), LV_PART_MAIN);
                set_label(id(page_home_house_hs_label), id(lune_touch_app).display_heat_source_name());
                lv_obj_set_style_text_color(id(page_home_hs_odin_label), lv_color_hex(odin_st == 0 ? c_faint : c_muted), LV_PART_MAIN);
              }
              // TODO(trin2): composed weather message; show wind as interim hint
              if (!wx_wind.empty() && wx_wind != "--") {
                set_label(id(page_home_house_msg_text), wx_wind);
                lv_obj_clear_flag(id(page_home_house_msg), LV_OBJ_FLAG_HIDDEN);
              } else {
                lv_obj_add_flag(id(page_home_house_msg), LV_OBJ_FLAG_HIDDEN);
              }

              const bool large = node_count <= 2;
              const int head_w = large ? 150 : 124;
              const int gap = large ? 10 : 8;
              const int row_pad_x = large ? 14 : 12;
              const int row_pad_y = large ? 12 : 9;
              const int groups = std::max(1, static_cast<int>(node_count));
              const int avail_h = 600 - 64 - 104 - 10 - 16;
              const int row_h = std::max(large ? 160 : 77,
                  (avail_h - gap * (groups - 1)) / groups);
              const int content_w = 992 - 2 * row_pad_x;
              const int tiles_w = content_w - head_w - gap;
              const int tile_w = std::max(64, (tiles_w - gap * 5) / 6);
              const int tile_h = std::max(64, row_h - 2 * row_pad_y);

              for (uint8_t node = 0; node < 4; node++) {
                if (node >= node_count) {
                  lv_obj_add_flag(mrows[node], LV_OBJ_FLAG_HIDDEN);
                  for (uint8_t z = 0; z < 6; z++)
                    lv_obj_add_flag(ztile[node][z], LV_OBJ_FLAG_HIDDEN);
                  continue;
                }
                const int row_y = 64 + 104 + 10 + static_cast<int>(node) * (row_h + gap);
                lv_obj_clear_flag(mrows[node], LV_OBJ_FLAG_HIDDEN);
                lv_obj_set_pos(mrows[node], 16, row_y);
                lv_obj_set_size(mrows[node], 992, row_h);
                lv_obj_set_style_bg_color(mrows[node], lv_color_hex(c_card), LV_PART_MAIN);

                // Manifold HEAD
                std::string mtext = id(lune_touch_app).display_manifold_text(node);
                std::string mname = mtext;
                const size_t nl = mtext.find('\n');
                if (nl != std::string::npos)
                  mname = mtext.substr(0, nl);
                set_label(mrow_names[node], mname);
                lv_obj_set_style_text_font(mrow_names[node],
                    large ? id(lds_font_md) : id(lds_font_sm), LV_PART_MAIN);
                lv_obj_set_style_text_color(mrow_names[node], lv_color_hex(c_fg), LV_PART_MAIN);
                char mid_buf[8];
                std::snprintf(mid_buf, sizeof(mid_buf), "M%u", static_cast<unsigned>(node + 1));
                set_label(mrow_mids[node], mid_buf);
                lv_obj_set_style_text_color(mrow_mids[node], lv_color_hex(c_muted), LV_PART_MAIN);
                const std::string flow = strip_c(id(lune_touch_app).display_controller_flow_text(node));
                const std::string ret = strip_c(id(lune_touch_app).display_controller_return_text(node));
                set_label(mrow_flows[node], flow + "° → " + ret + "°");
                lv_obj_set_style_text_color(mrow_flows[node], lv_color_hex(c_muted), LV_PART_MAIN);

                float flow_f = NAN, ret_f = NAN;
                {
                  char *end = nullptr;
                  std::string fraw = id(lune_touch_app).display_controller_flow_text(node);
                  flow_f = strtof(fraw.c_str(), &end);
                  if (end == fraw.c_str()) flow_f = NAN;
                  end = nullptr;
                  std::string rraw = id(lune_touch_app).display_controller_return_text(node);
                  ret_f = strtof(rraw.c_str(), &end);
                  if (end == rraw.c_str()) ret_f = NAN;
                }
                if (large && std::isfinite(flow_f) && std::isfinite(ret_f)) {
                  char dtbuf[24];
                  std::snprintf(dtbuf, sizeof(dtbuf), "dT %.1f K", flow_f - ret_f);
                  for (char *p = dtbuf; *p; ++p)
                    if (*p == '.') *p = ',';
                  set_label(mrow_dts[node], dtbuf);
                  lv_obj_clear_flag(mrow_dts[node], LV_OBJ_FLAG_HIDDEN);
                  lv_obj_set_style_text_color(mrow_dts[node], lv_color_hex(c_muted), LV_PART_MAIN);
                } else {
                  lv_obj_add_flag(mrow_dts[node], LV_OBJ_FLAG_HIDDEN);
                }

                uint8_t m_call = 0, m_fault = 0;
                for (uint8_t z = 0; z < 6; z++) {
                  const uint8_t st = id(lune_touch_app).display_zone_overview_state(node, z);
                  if (st == 3) m_call++;
                  if (st == 4) m_fault++;
                }
                if (m_fault > 0) {
                  char sb[24];
                  std::snprintf(sb, sizeof(sb), "● %u fejl", static_cast<unsigned>(m_fault));
                  set_label(mrow_status[node], sb);
                  lv_obj_set_style_text_color(mrow_status[node], lv_color_hex(c_danger), LV_PART_MAIN);
                } else if (m_call > 0) {
                  set_label(mrow_status[node], "● Kalder");
                  lv_obj_set_style_text_color(mrow_status[node], lv_color_hex(c_accent_ink), LV_PART_MAIN);
                } else {
                  set_label(mrow_status[node], "● Hviler");
                  lv_obj_set_style_text_color(mrow_status[node], lv_color_hex(c_muted), LV_PART_MAIN);
                }

                // Position HEAD labels
                const int head_y0 = row_pad_y;
                lv_obj_set_pos(mrow_names[node], row_pad_x, head_y0);
                lv_obj_set_size(mrow_names[node], head_w - 8, large ? 32 : 28);
                lv_obj_set_pos(mrow_mids[node], row_pad_x, head_y0 + (large ? 28 : 24));
                lv_obj_set_pos(mrow_flows[node], row_pad_x, head_y0 + (large ? 50 : 44));
                if (large) {
                  lv_obj_set_pos(mrow_dts[node], row_pad_x, head_y0 + 70);
                  lv_obj_set_pos(mrow_status[node], row_pad_x, head_y0 + 90);
                } else {
                  lv_obj_set_pos(mrow_status[node], row_pad_x, head_y0 + 62);
                }

                const int tiles_x = row_pad_x + head_w + gap;
                for (uint8_t zone = 0; zone < 6; zone++) {
                  const uint8_t st = id(lune_touch_app).display_zone_overview_state(node, zone);
                  const int zx = tiles_x + static_cast<int>(zone) * (tile_w + gap);
                  const int zy = row_pad_y;
                  lv_obj_clear_flag(ztile[node][zone], LV_OBJ_FLAG_HIDDEN);
                  lv_obj_set_pos(ztile[node][zone], zx, zy);
                  lv_obj_set_size(ztile[node][zone], tile_w, tile_h);
                  lv_obj_set_style_radius(ztile[node][zone], large ? 16 : 14, LV_PART_MAIN);

                  if (st == 0) {
                    // Empty slot: raised dashed-ish border (solid raised, no text)
                    lv_obj_set_style_bg_opa(ztile[node][zone], LV_OPA_TRANSP, LV_PART_MAIN);
                    lv_obj_set_style_border_width(ztile[node][zone], 2, LV_PART_MAIN);
                    lv_obj_set_style_border_color(ztile[node][zone], lv_color_hex(c_raised), LV_PART_MAIN);
                    lv_obj_add_flag(zid[node][zone], LV_OBJ_FLAG_HIDDEN);
                    lv_obj_add_flag(zname[node][zone], LV_OBJ_FLAG_HIDDEN);
                    lv_obj_add_flag(ztemp[node][zone], LV_OBJ_FLAG_HIDDEN);
                    lv_obj_add_flag(zset[node][zone], LV_OBJ_FLAG_HIDDEN);
                    lv_obj_add_flag(zchart[node][zone], LV_OBJ_FLAG_HIDDEN);
                    for (uint8_t s = 0; s < 5; s++)
                      lv_obj_add_flag(zseg[node][zone][s], LV_OBJ_FLAG_HIDDEN);
                    continue;
                  }

                  lv_obj_set_style_bg_opa(ztile[node][zone], LV_OPA_COVER, LV_PART_MAIN);
                  lv_obj_set_style_bg_color(ztile[node][zone], lv_color_hex(c_raised), LV_PART_MAIN);
                  lv_obj_set_style_border_width(ztile[node][zone], 0, LV_PART_MAIN);
                  const lv_opa_t tile_opa = (st == 1) ? LV_OPA_50 : LV_OPA_COVER;
                  lv_obj_set_style_opa(ztile[node][zone], tile_opa, LV_PART_MAIN);

                  lv_obj_clear_flag(zid[node][zone], LV_OBJ_FLAG_HIDDEN);
                  lv_obj_clear_flag(zname[node][zone], LV_OBJ_FLAG_HIDDEN);
                  lv_obj_clear_flag(ztemp[node][zone], LV_OBJ_FLAG_HIDDEN);
                  lv_obj_clear_flag(zset[node][zone], LV_OBJ_FLAG_HIDDEN);

                  char zidbuf[8];
                  std::snprintf(zidbuf, sizeof(zidbuf), "Z%u", static_cast<unsigned>(zone + 1));
                  set_label(zid[node][zone], zidbuf);
                  // TODO(trin2): group chrome Z4–5 when formatter exists
                  lv_obj_set_style_text_color(zid[node][zone],
                      st == 4 ? lv_color_hex(c_danger) : lv_color_hex(c_muted), LV_PART_MAIN);
                  set_label(zname[node][zone], id(lune_touch_app).display_zone_name_text(node, zone));
                  lv_obj_set_style_text_color(zname[node][zone], lv_color_hex(c_fg), LV_PART_MAIN);
                  lv_obj_set_style_text_font(zname[node][zone],
                      large ? id(lds_font_sm) : id(lds_font_xs), LV_PART_MAIN);

                  std::string traw = id(lune_touch_app).display_zone_temperature_text(node, zone);
                  std::string sraw = id(lune_touch_app).display_zone_setpoint_text(node, zone);
                  float tc = NAN, sc = NAN;
                  {
                    char *end = nullptr;
                    tc = strtof(traw.c_str(), &end);
                    if (end == traw.c_str()) tc = NAN;
                    end = nullptr;
                    sc = strtof(sraw.c_str(), &end);
                    if (end == sraw.c_str()) sc = NAN;
                  }
                  if (st == 4) {
                    set_label(ztemp[node][zone], "Fejl");
                    lv_obj_set_style_text_color(ztemp[node][zone], lv_color_hex(c_danger), LV_PART_MAIN);
                    lv_obj_set_style_bg_opa(zset[node][zone], LV_OPA_TRANSP, LV_PART_MAIN);
                    lv_obj_set_style_text_align(zset[node][zone], LV_TEXT_ALIGN_LEFT, LV_PART_MAIN);
                    if (large && std::isfinite(tc)) {
                      set_label(zset[node][zone], std::string("Motorfejl · ") + fmt_c(tc, false));
                      lv_obj_set_style_text_color(zset[node][zone], lv_color_hex(c_danger), LV_PART_MAIN);
                    } else {
                      set_label(zset[node][zone], "");
                    }
                  } else if (st == 1) {
                    set_label(ztemp[node][zone], "Slukket");
                    lv_obj_set_style_text_color(ztemp[node][zone], lv_color_hex(c_muted), LV_PART_MAIN);
                    set_label(zset[node][zone], "");
                    lv_obj_set_style_bg_opa(zset[node][zone], LV_OPA_TRANSP, LV_PART_MAIN);
                  } else {
                    set_label(ztemp[node][zone], fmt_c(tc, false));
                    lv_obj_set_style_text_color(ztemp[node][zone], lv_color_hex(c_fg), LV_PART_MAIN);
                    // Afvigelses-chip (som web): ≤ −1 | ≤ −0,3 | ±0,3 | < +1 | ≥ +1 °C fra målet.
                    if (std::isfinite(tc) && std::isfinite(sc)) {
                      const float d = tc - sc;
                      const uint8_t k = d <= -1.0f ? 0 : d <= -0.3f ? 1 : d < 0.3f ? 2 : d < 1.0f ? 3 : 4;
                      char chip[16];
                      const char *sign = d > 0.05f ? "+" : (d < -0.05f ? "\u2212" : "\u00B1");
                      std::snprintf(chip, sizeof(chip), "%s%.1f°", sign, std::fabs(d));
                      for (char *c = chip; *c; c++) if (*c == '.') *c = ',';
                      set_label(zset[node][zone], chip);
                      lv_obj_set_style_bg_color(zset[node][zone], lv_color_hex(c_dev[k]), LV_PART_MAIN);
                      lv_obj_set_style_bg_opa(zset[node][zone], LV_OPA_COVER, LV_PART_MAIN);
                      lv_obj_set_style_radius(zset[node][zone], LV_RADIUS_CIRCLE, LV_PART_MAIN);
                      lv_obj_set_style_text_align(zset[node][zone], LV_TEXT_ALIGN_CENTER, LV_PART_MAIN);
                      lv_obj_set_style_text_color(zset[node][zone],
                          lv_color_hex(k == 0 ? c_on_dev1 : (k == 2 ? c_fg : c_on_warn_fill)), LV_PART_MAIN);
                      lv_obj_clear_flag(zset[node][zone], LV_OBJ_FLAG_HIDDEN);
                    } else {
                      set_label(zset[node][zone], "");
                      lv_obj_set_style_bg_opa(zset[node][zone], LV_OPA_TRANSP, LV_PART_MAIN);
                    }
                  }
                  lv_obj_set_style_text_font(ztemp[node][zone],
                      large ? id(lds_font_d36) : id(lds_font_d28), LV_PART_MAIN);

                  // Layout inside tile
                  const int pad_x = large ? 14 : 12;
                  const int pad_y = large ? 12 : 8;
                  lv_obj_set_pos(zid[node][zone], pad_x, pad_y);
                  lv_obj_set_size(zid[node][zone], 28, 18);
                  lv_obj_set_pos(zname[node][zone], pad_x + 28, pad_y);
                  lv_obj_set_size(zname[node][zone], std::max(40, tile_w - pad_x * 2 - 28), large ? 20 : 18);
                  if (large) {
                    // d36 needs font+10 height; keep clearance above «mål»
                    lv_obj_set_pos(ztemp[node][zone], pad_x, pad_y + 26);
                    lv_obj_set_size(ztemp[node][zone], tile_w - pad_x * 2, 46);
                    lv_obj_set_pos(zset[node][zone], pad_x, pad_y + 74);
                    lv_obj_set_size(zset[node][zone], st == 4 ? tile_w - pad_x * 2 : 64, 22);
                    // TODO(trin2): mini chart needs history — keep hidden
                    lv_obj_add_flag(zchart[node][zone], LV_OBJ_FLAG_HIDDEN);
                  } else {
                    lv_obj_set_pos(ztemp[node][zone], pad_x, pad_y + 20);
                    lv_obj_set_size(ztemp[node][zone], std::max(48, tile_w - pad_x * 2 - 56), 36);
                    lv_obj_set_pos(zset[node][zone], tile_w - pad_x - 52, pad_y + 28);
                    lv_obj_set_size(zset[node][zone], 52, 22);
                    lv_obj_add_flag(zchart[node][zone], LV_OBJ_FLAG_HIDDEN);
                  }

                  // Ventilbjælke: 5 segmenter á 20 % åbning for alle zoner (lukket = 0).
                  // Mængde → tekstfarve, ikke orange (LDS 13.4); fejl: første segment rødt.
                  uint8_t segs = 0;
                  if (st != 4 && st != 1) {
                    const uint8_t valve = id(lune_touch_app).display_zone_valve_pct(node, zone);
                    segs = valve == 0 ? 0 : static_cast<uint8_t>(std::min(5, (valve + 19) / 20));
                  }
                  const int seg_y = tile_h - pad_y - 5;
                  const int seg_gap = 3;
                  const int seg_w = std::max(8, (tile_w - pad_x * 2 - seg_gap * 4) / 5);
                  for (uint8_t s = 0; s < 5; s++) {
                    lv_obj_clear_flag(zseg[node][zone][s], LV_OBJ_FLAG_HIDDEN);
                    lv_obj_set_pos(zseg[node][zone][s], pad_x + s * (seg_w + seg_gap), seg_y);
                    lv_obj_set_size(zseg[node][zone][s], seg_w, 5);
                    uint32_t col = c_seg_off;
                    if (st == 4 && s == 0)
                      col = c_danger;
                    else if (s < segs)
                      col = c_fg;
                    lv_obj_set_style_bg_color(zseg[node][zone][s], lv_color_hex(col), LV_PART_MAIN);
                  }
                }
              }
            }

            lv_obj_add_flag(id(chrome_settings_button), LV_OBJ_FLAG_HIDDEN);

            // Zone detail (Home Zone / ZoneFault) — single pane, step navigation.
            if (active_page == 2) {
              // Debounced setpoint send (1.5 s after last −/+/preset)
              if (id(zone_pending_dirty) &&
                  (millis() - id(zone_last_adjust_ms)) >= 1500) {
                id(zone_pending_dirty) = false;
                if (std::isfinite(id(zone_pending_target)))
                  id(lune_touch_app).display_set_selected_target(id(zone_pending_target));
              }

              const uint8_t sel_node = id(lune_touch_app).display_selected_node_index();
              const uint8_t sel_zone = id(lune_touch_app).display_selected_zone_index();
              const uint8_t st = id(lune_touch_app).display_zone_overview_state(sel_node, sel_zone);
              const bool fault = (st == 4);

              set_label(id(page_zone_name), id(lune_touch_app).display_selected_room_name());
              set_label(id(page_zone_detail_room_label), id(lune_touch_app).display_selected_room_name());

              std::string mtext = id(lune_touch_app).display_manifold_text(sel_node);
              std::string mname = mtext;
              const size_t nl = mtext.find('\n');
              if (nl != std::string::npos)
                mname = mtext.substr(0, nl);
              char sub[64];
              std::snprintf(sub, sizeof(sub), "%s · Z%u", mname.c_str(),
                            static_cast<unsigned>(sel_zone + 1));
              set_label(id(page_zone_sub), sub);

              if (fault) {
                lv_obj_set_style_bg_color(id(page_zone_badge), lv_color_hex(${lds_danger_bg}), LV_PART_MAIN);
                lv_obj_set_style_text_color(id(page_zone_badge_text), lv_color_hex(${lds_danger}), LV_PART_MAIN);
                set_label(id(page_zone_badge_text), "Motorfejl");
                lv_obj_clear_flag(id(page_zone_fault_box), LV_OBJ_FLAG_HIDDEN);
                lv_obj_set_y(id(page_zone_chart_title), 150);
                lv_obj_set_y(id(page_zone_chart_legend), 150);
                lv_obj_set_y(id(page_zone_chart), 184);
              } else {
                lv_obj_set_style_bg_color(id(page_zone_badge), lv_color_hex(${lds_heat_fill}), LV_PART_MAIN);
                lv_obj_set_style_text_color(id(page_zone_badge_text), lv_color_hex(${lds_on_fill}), LV_PART_MAIN);
                set_label(id(page_zone_badge_text), st == 3 ? "Kalder varme" : (st == 1 ? "Slukket" : "Hviler"));
                lv_obj_add_flag(id(page_zone_fault_box), LV_OBJ_FLAG_HIDDEN);
                lv_obj_set_y(id(page_zone_chart_title), 18);
                lv_obj_set_y(id(page_zone_chart_legend), 18);
                lv_obj_set_y(id(page_zone_chart), 52);
              }

              const uint8_t zones_n = std::max<uint8_t>(1, id(lune_touch_app).display_enabled_zone_count());
              const uint8_t ord = id(lune_touch_app).display_selected_zone_ordinal() + 1;
              char ord_buf[24];
              std::snprintf(ord_buf, sizeof(ord_buf), "%u af %u",
                            static_cast<unsigned>(ord), static_cast<unsigned>(zones_n));
              set_label(id(page_zone_ordinal), ord_buf);

              std::string traw = id(lune_touch_app).display_zone_temperature_text(sel_node, sel_zone);
              char *end = nullptr;
              float tc = strtof(traw.c_str(), &end);
              if (end == traw.c_str()) tc = NAN;
              if (std::isfinite(tc)) {
                char tbuf[16];
                std::snprintf(tbuf, sizeof(tbuf), "%.1f", tc);
                for (char *p = tbuf; *p; ++p) if (*p == '.') *p = ',';
                set_label(id(page_zone_temp), tbuf);
              } else {
                set_label(id(page_zone_temp), "--,-");
              }

              float target = id(zone_pending_target);
              if (!std::isfinite(target) || !id(zone_pending_dirty)) {
                std::string sraw = id(lune_touch_app).display_zone_setpoint_text(sel_node, sel_zone);
                end = nullptr;
                target = strtof(sraw.c_str(), &end);
                if (end == sraw.c_str()) target = NAN;
                if (!id(zone_pending_dirty))
                  id(zone_pending_target) = target;
              }
              if (std::isfinite(target)) {
                char sbuf[16];
                std::snprintf(sbuf, sizeof(sbuf), "%.1f", target);
                for (char *p = sbuf; *p; ++p) if (*p == '.') *p = ',';
                set_label(id(page_zone_target), sbuf);
              } else {
                set_label(id(page_zone_target), "--,-");
              }

              // Preset active styling
              lv_obj_t *presets[3] = {
                id(page_zone_preset_0), id(page_zone_preset_1), id(page_zone_preset_2)
              };
              for (int i = 0; i < 3; i++) {
                const bool on = (id(zone_preset_idx) == i);
                lv_obj_set_style_bg_color(presets[i],
                    lv_color_hex(on ? ${lds_inv_bg} : ${lds_raised}), LV_PART_MAIN);
              }

              const uint8_t valve = id(lune_touch_app).display_zone_valve_pct(sel_node, sel_zone);
              char vbuf[16];
              std::snprintf(vbuf, sizeof(vbuf), "%u %%", static_cast<unsigned>(valve));
              set_label(id(page_zone_valve), vbuf);
              lv_obj_set_style_text_color(id(page_zone_valve),
                  lv_color_hex(fault ? ${lds_danger} : ${lds_fg}), LV_PART_MAIN);

              // Manifold return as proxy (no per-zone return)
              std::string ret = id(lune_touch_app).display_controller_return_text(sel_node);
              if (ret.size() >= 2 && ret.compare(ret.size() - 2, 2, " C") == 0)
                ret.resize(ret.size() - 2);
              for (char &ch : ret) if (ch == '.') ch = ',';
              set_label(id(page_zone_return), ret.empty() || ret == "--.-" ? "--,- °C" : (ret + " °C"));

              // TODO(trin3): preload + sensor binders
              set_label(id(page_zone_preload), "--,- °C");
              set_label(id(page_zone_sensor), "--");

              // Zone active visual (no enable API yet)
              const bool active = (st != 1 && st != 0);
              lv_obj_set_style_bg_color(id(page_zone_active),
                  lv_color_hex(active ? ${lds_inv_bg} : ${lds_raised}), LV_PART_MAIN);
              lv_obj_set_x(id(page_zone_active_knob), active ? 52 : 12);

              // Keep legacy chip dock hidden
              lv_obj_add_flag(id(page_zone_detail_keypad), LV_OBJ_FLAG_HIDDEN);
              lv_obj_t *controllers[4] = {
                id(page_zone_detail_controller_0), id(page_zone_detail_controller_1),
                id(page_zone_detail_controller_2), id(page_zone_detail_controller_3)
              };
              lv_obj_t *zchips[6] = {
                id(page_zone_detail_chip_0), id(page_zone_detail_chip_1), id(page_zone_detail_chip_2),
                id(page_zone_detail_chip_3), id(page_zone_detail_chip_4), id(page_zone_detail_chip_5)
              };
              for (uint8_t i = 0; i < 4; i++)
                lv_obj_add_flag(controllers[i], LV_OBJ_FLAG_HIDDEN);
              for (uint8_t i = 0; i < 6; i++)
                lv_obj_add_flag(zchips[i], LV_OBJ_FLAG_HIDDEN);
            }

            if (active_page == 3) {
              const auto paint_toggle = [](lv_obj_t *track, lv_obj_t *knob, bool on) {
                lv_obj_set_style_bg_color(track,
                    lv_color_hex(on ? ${lds_inv_bg} : ${lds_seg_off}), LV_PART_MAIN);
                lv_obj_set_style_bg_color(knob, lv_color_hex(on ? ${lds_inv_fg} : ${lds_fg}), LV_PART_MAIN);
                lv_obj_set_x(knob, on ? 36 : 4);
              };
              paint_toggle(id(page_settings_weather_track), id(page_settings_weather_knob),
                           id(lune_touch_app).display_weather_compensation_enabled());
              paint_toggle(id(page_settings_heat_track), id(page_settings_heat_knob),
                           id(lune_touch_app).display_heat_source_enabled());
              set_label(id(page_settings_timeout_value), id(lune_touch_app).display_idle_timeout_text());
            }

            // Problem strip retired — fault pill lives in the status bar (Home2/4).
            set_label(id(dashboard_activity_label), id(lune_touch_app).display_problem_text());
            lv_obj_add_flag(id(dashboard_problem_card), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(dashboard_startup_overlay), LV_OBJ_FLAG_HIDDEN);

