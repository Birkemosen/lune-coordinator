              {id(page_home_zone_3_0_temp), id(page_home_zone_3_1_temp), id(page_home_zone_3_2_temp),
               id(page_home_zone_3_3_temp), id(page_home_zone_3_4_temp), id(page_home_zone_3_5_temp)}
            };
            lv_obj_t *zset[4][6] = {
