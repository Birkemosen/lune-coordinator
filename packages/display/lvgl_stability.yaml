# Generated by esphome@aurora-smart-home v1.1.0
# https://github.com/tonylofgren/aurora-smart-home
#
# Waveshare ESP32-S3-Touch-LCD-7B local interface. The local display is one
# glanceable appliance dashboard. Browser views own setup and diagnostics.

globals:
  - id: problem_dismissed
    type: bool
    initial_value: 'false'
  # Main-loop backlight apply reads this flag. on_idle runs on the LVGL task,
  # so it must not perform the blocking CH422G I2C write itself.
  - id: display_awake
    type: bool
    initial_value: 'true'
  - id: zone_detail_keypad_buffer
    type: std::string
    initial_value: '""'
  - id: zone_detail_keypad_open
    type: bool
    initial_value: 'false'
  - id: service_submenu
    type: int
    initial_value: '0'
  - id: controller_picker_open
    type: bool
    initial_value: 'false'
  - id: menu_open
    type: bool
    initial_value: 'false'
  - id: overview_day_theme
    type: bool
    initial_value: 'false'
  - id: zone_pending_target
    type: float
    initial_value: 'NAN'
  - id: zone_pending_dirty
    type: bool
    initial_value: 'false'
  - id: zone_last_adjust_ms
    type: uint32_t
    initial_value: '0'
  - id: zone_preset_idx
    type: int
    initial_value: '-1'

i2c:
  - id: waveshare_panel_i2c
    sda: GPIO8
    scl: GPIO9
    frequency: 400kHz
    scan: false
    sda_pullup_enabled: true
    scl_pullup_enabled: true

ch422g:
  - id: waveshare_panel_io
    i2c_id: waveshare_panel_i2c
    initial_output_bits: 0xDF

display:
  - platform: rpi_dpi_rgb
    id: touch_lcd
    dimensions:
      width: 1024
      height: 600
    color_order: RGB
    auto_clear_enabled: false
    update_interval: never
    # 7B porch totals are 1386 x 661. Refresh is pclk / 916146, so 20 MHz
    # is ~22 Hz and looks like flicker on this RGB panel. 30 MHz is the
    # Waveshare demo clock (~33 Hz). ESPHome rejects 120 MHz octal PSRAM,
    # so this stays on 80 MHz PSRAM with the bounce-buffer ISR mitigations
    # already in the board profile (XIP, 64-byte cache, 1 KiB dashboard
    # chunks). Watch for screen drift under WiFi; that is an underrun.
    pclk_frequency: 30MHz
    pclk_inverted: true
    hsync_pulse_width: 162
    hsync_back_porch: 152
    hsync_front_porch: 48
    vsync_pulse_width: 45
    vsync_back_porch: 13
    vsync_front_porch: 3
    de_pin: GPIO5
    pclk_pin: GPIO7
    hsync_pin:
      number: GPIO46
      ignore_strapping_warning: true
    vsync_pin:
      number: GPIO3
      ignore_strapping_warning: true
    enable_pin:
      ch422g: waveshare_panel_io
      number: 2
      mode:
        output: true
    data_pins:
      - GPIO14
      - GPIO38
      - GPIO18
      - GPIO17
      - GPIO10
      - GPIO39
      - number: GPIO0
        ignore_strapping_warning: true
      - number: GPIO45
        ignore_strapping_warning: true
      - GPIO48
      - GPIO47
      - GPIO21
      - GPIO1
      - GPIO2
      - GPIO42
      - GPIO41
      - GPIO40

touchscreen:
  - platform: gt911
    id: touch_panel
    display: touch_lcd
    i2c_id: waveshare_panel_i2c
    interrupt_pin: GPIO4
    reset_pin:
      ch422g: waveshare_panel_io
      number: 1
      mode:
        output: true
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false
    update_interval: 20ms
    # Resume on release so the wake tap is consumed while LVGL is paused and
    # does not click a zone control. Routine coordinator updates never wake the
    # panel; only touch and an explicit POST /display/wake request do.
    on_release:
      then:
        - if:
            condition: lvgl.is_paused
            then:
              - lambda: 'id(display_awake) = true;'
              - lvgl.resume:


# One token observes the complete display model. A changed token performs one
# coalesced widget pass instead of thirteen independent label invalidations.
text_sensor:
  - platform: template
    id: touch_display_refresh_token
    internal: true
    # Hydronic state changes slowly. Five seconds keeps the display current
    # without repeatedly invalidating pixels for sub-second poll bursts.
    update_interval: 5s
    lambda: |-
      return id(lune_touch_app).display_refresh_token();
    on_value:
      then:
        - lambda: |-
            const auto set_label = [](lv_obj_t *label, const std::string &value) {
