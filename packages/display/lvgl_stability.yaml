              {id(page_home_zone_3_0_set), id(page_home_zone_3_1_set), id(page_home_zone_3_2_set),
               id(page_home_zone_3_3_set), id(page_home_zone_3_4_set), id(page_home_zone_3_5_set)}
            };
            lv_obj_t *zchart[4][6] = {
              {id(page_home_zone_0_0_chart), id(page_home_zone_0_1_chart), id(page_home_zone_0_2_chart),
               id(page_home_zone_0_3_chart), id(page_home_zone_0_4_chart), id(page_home_zone_0_5_chart)},
              {id(page_home_zone_1_0_chart), id(page_home_zone_1_1_chart), id(page_home_zone_1_2_chart),
               id(page_home_zone_1_3_chart), id(page_home_zone_1_4_chart), id(page_home_zone_1_5_chart)},
              {id(page_home_zone_2_0_chart), id(page_home_zone_2_1_chart), id(page_home_zone_2_2_chart),
               id(page_home_zone_2_3_chart), id(page_home_zone_2_4_chart), id(page_home_zone_2_5_chart)},
              {id(page_home_zone_3_0_chart), id(page_home_zone_3_1_chart), id(page_home_zone_3_2_chart),
               id(page_home_zone_3_3_chart), id(page_home_zone_3_4_chart), id(page_home_zone_3_5_chart)}
            };
            lv_obj_t *zseg[4][6][5] = {
              {{id(page_home_zone_0_0_seg0), id(page_home_zone_0_0_seg1), id(page_home_zone_0_0_seg2),
                id(page_home_zone_0_0_seg3), id(page_home_zone_0_0_seg4)},
               {id(page_home_zone_0_1_seg0), id(page_home_zone_0_1_seg1), id(page_home_zone_0_1_seg2),
                id(page_home_zone_0_1_seg3), id(page_home_zone_0_1_seg4)},
               {id(page_home_zone_0_2_seg0), id(page_home_zone_0_2_seg1), id(page_home_zone_0_2_seg2),
                id(page_home_zone_0_2_seg3), id(page_home_zone_0_2_seg4)},
               {id(page_home_zone_0_3_seg0), id(page_home_zone_0_3_seg1), id(page_home_zone_0_3_seg2),
                id(page_home_zone_0_3_seg3), id(page_home_zone_0_3_seg4)},
               {id(page_home_zone_0_4_seg0), id(page_home_zone_0_4_seg1), id(page_home_zone_0_4_seg2),
                id(page_home_zone_0_4_seg3), id(page_home_zone_0_4_seg4)},
               {id(page_home_zone_0_5_seg0), id(page_home_zone_0_5_seg1), id(page_home_zone_0_5_seg2),
                id(page_home_zone_0_5_seg3), id(page_home_zone_0_5_seg4)}},
              {{id(page_home_zone_1_0_seg0), id(page_home_zone_1_0_seg1), id(page_home_zone_1_0_seg2),
                id(page_home_zone_1_0_seg3), id(page_home_zone_1_0_seg4)},
               {id(page_home_zone_1_1_seg0), id(page_home_zone_1_1_seg1), id(page_home_zone_1_1_seg2),
                id(page_home_zone_1_1_seg3), id(page_home_zone_1_1_seg4)},
               {id(page_home_zone_1_2_seg0), id(page_home_zone_1_2_seg1), id(page_home_zone_1_2_seg2),
                id(page_home_zone_1_2_seg3), id(page_home_zone_1_2_seg4)},
               {id(page_home_zone_1_3_seg0), id(page_home_zone_1_3_seg1), id(page_home_zone_1_3_seg2),
