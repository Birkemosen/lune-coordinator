interval:
  - interval: 50ms
    then:
      - lambda: |-
          if (id(lune_touch_app).consume_display_wake_request()) {
            id(display_awake) = true;
            lv_disp_trig_activity(nullptr);
          }
          if (id(lune_touch_app).display_idle_timeout_ms() == 0)
            id(display_awake) = true;
          // Zone setpoint debounce: send 1.5 s after last −/+/preset.
          if (id(zone_pending_dirty) &&
              (millis() - id(zone_last_adjust_ms)) >= 1500) {
            id(zone_pending_dirty) = false;
            if (std::isfinite(id(zone_pending_target))) {
              id(lune_touch_app).display_set_selected_target(id(zone_pending_target));
              id(touch_display_refresh_token).update();
            }
          }
          id(lune_touch_app).note_display_state(id(display_awake), id(lune_touch_lvgl).is_paused(),
                                                lv_disp_get_inactive_time(nullptr));
          static bool backlight_on = true;
          const bool want_on = id(display_awake);
          if (want_on == backlight_on)
            return;
          backlight_on = want_on;
          id(waveshare_panel_io).digital_write(2, want_on);
      - if:
          condition: lvgl.is_paused
          then:
            - if:
                condition:
                  lambda: 'return id(display_awake);'
                then:
                  - lvgl.resume:
