lvgl:
  id: lune_touch_lvgl
  displays:
    - touch_lcd
  touchscreens:
    - touch_panel
  # Partial invalidation avoids transferring a complete 1024x600 RGB565 frame
  # every refresh. 12% follows ESPHome's PSRAM guidance for large displays.
  buffer_size: 12%
  full_refresh: false
  draw_rounding: 2
  byte_order: little_endian
  log_level: WARN
  update_interval: 50ms
  color_depth: 16
  default_font: lds_font_sm
  style_definitions: !include lvgl/lune_theme_styles.yaml
  on_idle:
    - timeout: 60s
      then:
        - if:
            condition:
              lambda: 'return id(lune_touch_app).display_active_page() == 2;'
            then:
              - lambda: |-
                  id(menu_open) = false;
                  id(controller_picker_open) = false;
                  id(zone_detail_keypad_open) = false;
                  id(zone_detail_keypad_buffer) = "";
                  id(zone_pending_dirty) = false;
                  id(lune_touch_app).display_set_active_page(0);
                  id(touch_display_refresh_token).update();
        - if:
            condition:
              lambda: 'return id(lune_touch_app).display_idle_timeout_ms() == 60000;'
            then:
              - lambda: 'id(display_awake) = false;'
              - lvgl.pause:
    - timeout: 120s
      then:
        - if:
            condition:
              lambda: 'return id(lune_touch_app).display_idle_timeout_ms() == 120000;'
            then:
              - lambda: 'id(display_awake) = false;'
              - lvgl.pause:
    - timeout: 300s
      then:
        - if:
            condition:
              lambda: 'return id(lune_touch_app).display_idle_timeout_ms() == 300000;'
            then:
              - lambda: 'id(display_awake) = false;'
              - lvgl.pause:
  bottom_layer:
    bg_color: ${lds_bg}
    bg_opa: COVER
  widgets:
    - obj:
        id: lune_touch_root
        x: 0
        y: 0
        width: 1024
        height: 600
        bg_color: ${lds_bg}
        bg_opa: COVER
        border_width: 0
        outline_width: 0
        radius: 0
        pad_all: 0
        scrollable: false
        widgets:
          - obj:
              id: page_home
              x: 0
              y: 0
              width: 1024
              height: 600
              bg_color: ${lds_bg}
              bg_opa: COVER
              border_width: 0
              radius: 0
              pad_all: 0
              scrollable: false
              widgets:
                - label:
                    id: page_home_title
                    hidden: true
                    x: 0
                    y: 0
                    width: 1
                    height: 1
                    text: "Lune Touch"
                    text_color: ${lds_muted}
                    text_font: lds_font_xs
                    bg_opa: 0%
                - !include
                    file: lvgl/home_status_bar.yaml
                - !include
                    file: lvgl/home_house_row.yaml
                - !include
                    file: lvgl/home_manifold_row.yaml
                    vars: {node: 0, human: 1}
                - !include
                    file: lvgl/home_manifold_row.yaml
                    vars: {node: 1, human: 2}
                - !include
                    file: lvgl/home_manifold_row.yaml
                    vars: {node: 2, human: 3}
                - !include
                    file: lvgl/home_manifold_row.yaml
                    vars: {node: 3, human: 4}

          - !include
              file: lvgl/zone_screen.yaml

          - obj:
              id: page_settings
              hidden: true
              x: 0
              y: 0
              width: 1024
              height: 600
              bg_color: ${lds_bg}
              bg_opa: 100%
              border_width: 0
              radius: 0
              pad_all: 0
              scrollable: false
              widgets:
                - obj:
                    id: page_settings_pane
                    x: 0
                    y: 52
                    width: 1024
                    height: 490
                    bg_color: ${lds_bg}
                    bg_opa: 100%
                    border_width: 0
                    radius: 0
                    pad_all: 0
                    scrollable: false
                    widgets:
                      - label:
                          id: page_settings_title
                          x: 24
