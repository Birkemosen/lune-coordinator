# Identity + stacked flow/return for one live manifold row.
obj:
  id: page_home_ctrl_${index}
  hidden: true
  x: 24
  y: 64
  width: 80
  height: 80
  bg_color: ${lt_color_control_bg}
  bg_opa: 0%
  border_width: 0
  radius: 0
  pad_all: 0
  scrollable: false
  widgets:
    - label:
        id: page_home_ctrl_${index}_name
        x: 0
        y: 0
        width: 80
        height: 20
        text: "C${human}"
        text_color: ${lt_color_text}
        text_font: montserrat_16
        long_mode: clip
        bg_opa: 0%
    - label:
        id: page_home_ctrl_${index}_flow_icon
        x: 0
        y: 24
        width: 20
        height: 22
        text: "\uF077"
        text_color: ${lt_color_series_heat}
        text_font: montserrat_16
        text_align: CENTER
        bg_opa: 0%
    - label:
        id: page_home_ctrl_${index}_flow
        x: 20
        y: 24
        width: 60
        height: 22
        text: "--.-"
        text_color: ${lt_color_series_heat}
        text_font: montserrat_16
        long_mode: clip
        bg_opa: 0%
    - label:
        id: page_home_ctrl_${index}_return_icon
        x: 0
        y: 50
        width: 20
        height: 22
        text: "\uF078"
        text_color: ${lt_color_series_cool}
        text_font: montserrat_16
        text_align: CENTER
        bg_opa: 0%
    - label:
        id: page_home_ctrl_${index}_return
        x: 20
        y: 50
        width: 60
        height: 22
        text: "--.-"
        text_color: ${lt_color_series_cool}
        text_font: montserrat_16
        long_mode: clip
        bg_opa: 0%
