# ESPHome style_definitions for Lune Touch vægskærm.
# pad_hor/pad_ver findes ikke i ESPHome — brug pad_left/right/top/bottom.
# radius CIRCLE i stedet for 999.

- id: lds_card
  bg_color: ${lds_card}
  bg_opa: COVER
  radius: 20
  border_width: 0
  shadow_width: 0
  pad_all: 16
- id: lds_tile
  bg_color: ${lds_raised}
  bg_opa: COVER
  radius: 14
  border_width: 0
  pad_all: 10
  text_color: ${lds_fg}
- id: lds_tile_primary
  border_width: 2
  border_color: ${lds_accent}
- id: lds_tile_selected
  bg_color: ${lds_inv_bg}
  text_color: ${lds_inv_fg}
- id: lds_seg_on
  bg_color: ${lds_accent}
  bg_opa: COVER
  radius: 2
- id: lds_seg_off
  bg_color: ${lds_seg_off}
  bg_opa: COVER
  radius: 2
- id: lds_seg_fault
  bg_color: ${lds_danger}
  bg_opa: COVER
  radius: 2
- id: lds_btn_round
  bg_color: ${lds_raised}
  bg_opa: COVER
  radius: CIRCLE
  border_width: 0
  shadow_width: 0
  text_color: ${lds_fg}
- id: lds_btn_pill
  bg_color: ${lds_raised}
  bg_opa: COVER
  radius: CIRCLE
  border_width: 0
  shadow_width: 0
  pad_left: 28
  pad_right: 28
  text_color: ${lds_fg}
  text_font: lds_font_sm
- id: lds_btn_active
  bg_color: ${lds_inv_bg}
  text_color: ${lds_inv_fg}
- id: lds_btn_danger
  bg_color: ${lds_danger}
  text_color: ${lds_bg}
- id: lds_badge_hot
  bg_color: ${lds_accent_ink}
  bg_opa: COVER
  radius: CIRCLE
  pad_left: 14
  pad_right: 14
  pad_top: 4
  pad_bottom: 4
  text_color: ${lds_on_accent}
  text_font: lds_font_xs
- id: lds_badge_bad
  bg_color: ${lds_danger_bg}
  bg_opa: COVER
  radius: CIRCLE
  pad_left: 14
  pad_right: 14
  pad_top: 4
  pad_bottom: 4
  text_color: ${lds_danger}
  text_font: lds_font_xs
- id: lds_msg_info
  bg_color: ${lds_info_bg}
  bg_opa: COVER
  radius: 12
  pad_all: 12
  text_color: ${lds_info}
  text_font: lds_font_xs
- id: lds_text_muted
  text_color: ${lds_muted}
- id: lds_text_hero
  text_font: lds_font_hero
  text_color: ${lds_fg}
