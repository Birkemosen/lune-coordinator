        x: 22
        y: 4
        clickable: false
        bg_opa: 0%
        border_width: 0
        outline_width: 0
        shadow_width: 0
    - image:
        id: page_home_fx_${index}_sky_3
        src: weather_sky_sun
        hidden: true
        x: 22
        y: 4
        clickable: false
        bg_opa: 0%
