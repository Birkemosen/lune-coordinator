# One of the next 12 forecast hours: sky, temperature, wind, then time under a rule.
obj:
  id: page_home_fx_${index}
  hidden: true
  x: 16
  y: 36
  width: 76
  height: 108
  bg_opa: 0%
  border_width: 0
  radius: 0
  pad_all: 0
  scrollable: false
  widgets:
    - image:
        id: page_home_fx_${index}_sky_0
        src: weather_sky_moon
        hidden: true
        x: 22
        y: 4
        clickable: false
        bg_opa: 0%
        border_width: 0
        outline_width: 0
        shadow_width: 0
