        clickable: false
        bg_opa: 0%
        border_width: 0
        outline_width: 0
        shadow_width: 0
    - label:
        id: page_home_fx_${index}_temp
        x: 0
        y: 38
        width: 76
        height: 22
        text: "--"
        text_color: ${lt_color_text}
        text_font: montserrat_16
        text_align: CENTER
        long_mode: clip
        bg_opa: 0%
    - label:
        id: page_home_fx_${index}_wind
        x: 0
        y: 60
        width: 76
        height: 18
        text: "--"
        text_color: ${lt_color_text_muted}
        text_font: montserrat_14
        text_align: CENTER
        long_mode: clip
        bg_opa: 0%
    - obj:
        id: page_home_fx_${index}_bar
        x: 8
        y: 82
        width: 60
        height: 1
        bg_color: ${lt_color_separator}
        bg_opa: 100%
        border_width: 0
        radius: 0
        pad_all: 0
        scrollable: false
    - label:
        id: page_home_fx_${index}_hour
        x: 0
        y: 86
        width: 76
        height: 18
        text: "--:--"
        text_color: ${lt_color_text_muted}
        text_font: montserrat_14
        text_align: CENTER
        long_mode: clip
        bg_opa: 0%
