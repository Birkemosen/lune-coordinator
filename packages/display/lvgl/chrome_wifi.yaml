        max_value: 100
        value: 100
        start_angle: 205deg
        end_angle: 335deg
        bg_opa: 0%
        arc_width: 3
        arc_color: ${lds_ok}
        indicator:
          arc_width: 3
          arc_color: ${lds_ok}
        knob:
          bg_opa: 0%
          pad_all: 0
        clickable: false
