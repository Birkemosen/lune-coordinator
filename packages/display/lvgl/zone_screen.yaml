              x: 28
              y: 240
              width: 96
              height: 96
              bg_color: ${lds_raised}
              bg_opa: COVER
              border_width: 0
              radius: CIRCLE
              shadow_width: 0
              pad_all: 0
              widgets:
                - label:
                    align: CENTER
                    text: "−"
                    text_color: ${lds_fg}
                    text_font: lds_font_lg
              on_click:
                - lambda: |-
                    float t = id(zone_pending_target);
                    if (!std::isfinite(t)) {
                      std::string raw = id(lune_touch_app).display_zone_setpoint_text(
                          id(lune_touch_app).display_selected_node_index(),
                          id(lune_touch_app).display_selected_zone_index());
                      char *end = nullptr;
                      t = strtof(raw.c_str(), &end);
                      if (end == raw.c_str()) t = 21.0f;
                    }
                    t = std::max(12.0f, std::min(28.0f, t - 0.5f));
                    id(zone_pending_target) = t;
                    id(zone_pending_dirty) = true;
                    id(zone_last_adjust_ms) = millis();
                    id(zone_preset_idx) = -1;
                    id(touch_display_refresh_token).update();
