        x: 20
        y: 16
        width: 64
        height: 64
        bg_color: ${lds_raised}
        bg_opa: COVER
        border_width: 0
        radius: CIRCLE
        shadow_width: 0
        pad_all: 0
        widgets:
          - label:
              align: CENTER
              text: "<"
              text_color: ${lds_fg}
              text_font: lds_font_lg
        on_click:
          - lambda: |-
              id(zone_pending_dirty) = false;
              id(zone_detail_keypad_open) = false;
              id(zone_detail_keypad_buffer) = "";
              id(lune_touch_app).display_set_active_page(0);
              id(touch_display_refresh_token).update();
