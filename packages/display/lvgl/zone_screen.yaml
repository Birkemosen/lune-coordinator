# Zone fuldskærm (SCREENS.md Zone / ZoneFault).
# Én delt pane (ikke 24 tileview-kopier — RAM); zone skiftes med ‹ › / swipe-områder.
# TODO(trin3): Comfort/Eco/Nat findes ikke i datamodel — faste 22/20/18 som UI-forvalg.
# TODO(trin3): 48-punkts historikgraf; zone til/fra mangler display-API (kun visning).
# TODO(trin3): zone-retur °C og BLE-føler-label mangler display-bindere.
obj:
  id: page_zone_detail
  hidden: true
  x: 0
  y: 0
  width: 1024
  height: 600
  bg_color: ${lds_bg}
  bg_opa: COVER
  border_width: 0
  radius: 0
  pad_all: 0
  scrollable: false
